# Local-only convenience: runs the Java service with a throwaway Mongo + Redis.
# For real work, point MONGO_READ_URI/REDIS_* at the shared TEST infrastructure
# instead of these local containers. Never at production.
services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      MONGO_READ_URI: mongodb://mongo:27017/main
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CRYPTO_SECRET_KEY: ${CRYPTO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
